<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawnPush &mdash; A Study in Tactics</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/pawnpushicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/pawnpushicon.png">
  <link rel="shortcut icon" href="icons/pawnpushicon.png">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="audio-manager.js"></script>
</head>
<body class="puzzle-page">

<header>
  <div class="header-content">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="icons/pawnpushicon.png" alt="PawnPush Logo" style="width: 64px; height: 64px; object-fit: contain;">
      <h1>PawnPush</h1>
    </div>
    <div class="puzzle-navigation">
      <a href="index.html" class="back-btn">&larr;&nbsp;&nbsp;Index</a>
    </div>
  </div>
</header>

<main>
  <div id="puzzle-theme" class="puzzle-theme-card">
    <div class="theme-icon">&#9822;</div>
    <div class="theme-text">Loading puzzle&hellip;</div>
  </div>
  
  <div class="puzzle-container">
    <div id="board-container" class="x">
      <div class="board-wrapper">
        <div id="board"></div>
      </div>
    </div>

    <div id="puzzle-info-sidebar" class="info-sidebar">
      <div class="info-section puzzle-details">
        <div class="section-header">
          <div class="section-icon">&sect;</div>
          <h3>Position</h3>
        </div>
        <div class="info-cards">
          <div id="puzzle-rating" class="info-card">
            <span class="info-label">Rating</span>
            <span class="info-value">--</span>
          </div>
          <div id="turn-indicator" class="info-card turn-card">
            <span class="info-label">Turn</span>
            <span class="info-value">-- to move</span>
          </div>
        </div>
      </div>
      
      <div class="info-section move-section">
        <div class="section-header">
          <div class="section-icon">&para;</div>
          <h3>Notation</h3>
        </div>
        <div id="move-history" class="move-history-container">
          <em class="no-moves">Make your first move.</em>
        </div>
      </div>

      <div class="info-section actions-section">
        <div class="section-header">
          <div class="section-icon">&#10022;</div>
          <h3>Study</h3>
        </div>
        <div class="action-buttons">
          <button id="hintBtn" class="action-btn hint-btn">
            <span class="btn-text">Reveal a hint</span>
          </button>
          <button id="nextPuzzleBtn" class="action-btn next-btn">
            <span class="btn-text">Next study &rarr;</span>
          </button>
        </div>
      </div>
    </div>
  </div>


  <button id="coachBtn" class="coach-floating-btn">
    <span class="coach-text">Consult the Master</span>
  </button>


  <div id="chatPopup" class="chat-popup hidden">
    <div class="chat-header">
      <div class="chat-title">
        <span>The Master</span>
      </div>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-area">
      <input id="chatInput" type="text" placeholder="Ask for a hint&hellip;" class="chat-input"/>
      <button id="chatSend" class="chat-send-btn">→</button>
    </div>
  </div>

</main>

<script type="module" src="PuzzleScript.js"></script>
</body>
</html>
