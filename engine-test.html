<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Test</title>
    <style>
        body { background: #121212; color: #fff; font-family: monospace; padding: 2rem; }
        #output { background: #1e1e1e; padding: 1rem; border: 1px solid #333; height: 80vh; overflow-y: auto; white-space: pre-wrap; }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #2196F3; }
    </style>
</head>
<body>
    <h1>PawnPush Engine Integration Test</h1>
    <div id="output">Initializing...</div>

    <script type="module">
        import { createEngine } from '/engine/engine-wrapper.js';

        const output = document.getElementById('output');
        const log = (msg, type = '') => {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type) div.className = type;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        };

        async function runTest() {
            try {
                log('Loading engine...', 'info');
                const engine = await createEngine();
                
                engine.onMessage((line) => {
                    log(`ENGINE: ${line}`);
                    if (line.includes('uciok')) {
                        log('Received uciok - Engine is ready', 'success');
                        setTimeout(() => {
                            log('Sending: isready', 'info');
                            engine.send('isready');
                        }, 500);
                    }
                    if (line.includes('readyok')) {
                        log('Received readyok - Starting search', 'success');
                        setTimeout(() => {
                            log('Sending: position startpos', 'info');
                            engine.send('position startpos');
                            log('Sending: go depth 10', 'info');
                            engine.send('go depth 10');
                        }, 500);
                    }
                    if (line.startsWith('bestmove')) {
                        log(`Search complete. Best move: ${line.split(' ')[1]}`, 'success');
                        log('Test passed successfully!', 'success');
                    }
                });

                log('Sending: uci', 'info');
                engine.send('uci');

            } catch (error) {
                log(`ERROR: ${error.message}`, 'error');
                console.error(error);
            }
        }

        runTest();
    </script>
</body>
</html>
