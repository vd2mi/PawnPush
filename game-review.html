<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawnPush - Game Review</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/pawnpushicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/pawnpushicon.png">
  <link rel="shortcut icon" href="icons/pawnpushicon.png">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.js"></script>
  <script src="/plotly.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="audio-manager.js"></script>
  <style>
      :root {
          --primary-color: var(--gilt);
          --secondary-color: var(--oxblood);
          --bg-card: rgba(20, 17, 16, 0.85);
          --border-color: rgba(200, 166, 98, 0.22);
          --text-muted: var(--bone);
      }
      .swal2-popup {
          background: var(--bg-card) !important;
          border: 1px solid var(--border-color) !important;
          border-radius: 12px !important;
          color: #fff !important;
          padding: 1.5rem !important;
      }
      .swal2-title {
          color: var(--secondary-color) !important;
      }
      .swal2-html-container {
          margin: 1rem 0 !important;
          padding: 0 !important;
      }
      .swal2-input, .swal2-textarea, .swal2-select {
          background: rgba(0, 0, 0, 0.3) !important;
          border: 1px solid rgba(255, 255, 255, 0.2) !important;
          color: #fff !important;
          border-radius: 6px !important;
          padding: 0.75rem !important;
          width: calc(100% - 2rem) !important;
          max-width: calc(100% - 2rem) !important;
          margin: 0.5rem auto !important;
          box-sizing: border-box !important;
      }
      .swal2-input:focus, .swal2-textarea:focus, .swal2-select:focus {
          border-color: var(--primary-color) !important;
          outline: none !important;
      }
      .swal2-html-container {
          color: var(--text-muted) !important;
      }
      .swal2-confirm {
          background: var(--primary-color) !important;
          border: none !important;
          border-radius: 6px !important;
          padding: 0.75rem 1.5rem !important;
      }
      .swal2-cancel {
          background: rgba(255, 255, 255, 0.1) !important;
          border: 1px solid rgba(255, 255, 255, 0.2) !important;
          border-radius: 6px !important;
          padding: 0.75rem 1.5rem !important;
      }
      .swal2-input-label {
          color: var(--text-muted) !important;
          display: block !important;
          width: 100% !important;
          text-align: center !important;
          margin-bottom: 0.5rem !important;
      }
      .swal2-validation-message {
          background: rgba(239, 68, 68, 0.1) !important;
          color: #ef4444 !important;
          border: 1px solid rgba(239, 68, 68, 0.3) !important;
      }
      body.review-page {
          background-color: var(--ink);
          color: var(--parchment);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
      }
      header {
          background: transparent;
          padding: 1.25rem 1.5rem;
          border-bottom: 1px solid var(--rule);
      }
      .header-content {
          max-width: 1600px;
          margin: 0 auto;
          display: flex;
          align-items: center;
          justify-content: space-between;
      }
      h1 {
          margin: 0;
          font-family: var(--serif);
          font-style: italic;
          font-weight: 900;
          font-variation-settings: "SOFT" 100, "WONK" 1;
          font-size: 2rem;
          letter-spacing: -0.01em;
          color: var(--parchment);
      }
      h1::first-letter { color: var(--gilt); }
      .tagline {
          margin: 0;
          font-size: 0.9rem;
          color: var(--text-muted);
      }
      .back-btn {
          color: #fff;
          padding: 0.5rem 1rem;
          border-radius: 6px;
          border: 1px solid rgba(255,255,255,0.2);
          text-decoration: none;
          background: rgba(255,255,255,0.1);
      }
      main {
          flex: 1;
          padding: 1rem;
          max-width: 1600px;
          margin: 0 auto;
          width: 100%;
      }
      .game-review-container {
          display: grid;
          grid-template-columns: 400px minmax(500px, 1fr) 320px;
          gap: 1.5rem;
          height: calc(100vh - 150px);
      }
      .panel {
          background: var(--ink-raise);
          border: 1px solid var(--rule-strong);
          border-radius: 2px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: var(--shadow-1);
      }
      .panel-header {
          padding: 1rem;
          border-bottom: 1px solid rgba(255,255,255,0.08);
          display: flex;
          align-items: center;
          gap: 0.5rem;
          background: rgba(0,0,0,0.25);
      }
      .panel-header h3 {
          margin: 0;
          font-family: var(--mono);
          font-weight: 500;
          font-size: 0.72rem;
          color: var(--muted);
          letter-spacing: 0.28em;
          text-transform: uppercase;
      }
      .panel-content {
          flex: 1;
          padding: 1rem;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 1rem;
      }
      textarea,
      input[type="text"] {
          background: rgba(0,0,0,0.35);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 6px;
          color: #fff;
          padding: 0.5rem;
          font-family: monospace;
          width: 100%;
      }
      textarea:focus,
      input:focus {
          outline: none;
          border-color: var(--primary-color);
      }
      .button-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.5rem;
      }
      .btn {
          border: 1px solid var(--rule-strong);
          border-radius: 2px;
          padding: 0.75rem;
          background: rgba(255,255,255,0.04);
          color: var(--parchment);
          font-family: var(--mono);
          font-size: 0.7rem;
          font-weight: 500;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          cursor: pointer;
          transition: background 0.15s ease, border-color 0.15s ease;
      }
      .btn:hover {
          background: rgba(255,255,255,0.08);
          border-color: var(--gilt);
      }
      .btn:active {
          transform: scale(0.98);
      }
      .btn .btn-text {
          font-size: inherit;
          font-family: inherit;
          letter-spacing: inherit;
      }
      .btn-primary {
          background: rgba(200,166,98,0.1);
          border-color: rgba(200,166,98,0.4);
      }
      .btn-primary:hover {
          background: rgba(200,166,98,0.18);
      }
      .btn-secondary {
          background: rgba(255,255,255,0.04);
      }
      .chesscom-btn {
          grid-column: span 2;
      }
      .analysis-display {
          background: rgba(0,0,0,0.45);
          border: 1px solid rgba(255,255,255,0.05);
          border-radius: 10px;
          padding: 1rem;
          min-height: 80px;
          font-family: var(--mono);
          line-height: 1.5;
      }
      .analysis-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 0.75rem;
      }
      .analysis-badge {
          padding: 0.35rem 0.75rem;
          border-radius: 999px;
          font-size: 0.85rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
      }
      .analysis-row {
          margin: 0.1rem 0;
          line-height: 1.3;
      }
      .analysis-score {
          font-weight: bold;
      }
      .insight-row {
          margin-top: 0.5rem;
          color: var(--text-muted);
          font-style: italic;
      }
      .analysis-empty {
          opacity: 0.65;
          font-style: italic;
          text-align: center;
          padding: 2rem 0;
      }
      .board-section {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          place-self: center;
          width: 100%;
      }
      .eval-bar-container {
          width: 100%;
          max-width: 600px;
          height: 14px;
          background: var(--ink-card);
          border-radius: 1px;
          position: relative;
          overflow: hidden;
          border: 1px solid var(--rule-strong);
          margin: 0 auto 0.75rem;
      }
      .eval-fill {
          height: 100%;
          width: 50%;
          background: linear-gradient(90deg, #3a2817, var(--parchment));
          transition: width 0.4s ease, background 0.4s ease;
      }
      .eval-text {
          position: absolute;
          width: 100%;
          text-align: center;
          line-height: 14px;
          font-size: 0.7rem;
          font-weight: 500;
          font-family: var(--mono);
          letter-spacing: 0.08em;
          color: var(--ink);
          mix-blend-mode: difference;
          filter: invert(1);
      }
      .board-wrapper {
          width: min(80vw, 500px);
          aspect-ratio: 1 / 1;
          border-radius: 2px;
          border: 1px solid #3a2817;
          box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(200,166,98,0.1);
          overflow: hidden;
          position: relative;
      }
      #board {
          width: 100%;
          height: 100%;
      }
      #board-arrows {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
      }
      .chess-board .square.white-1e1e1e {
          background: #e8dcc2 !important;
      }
      .chess-board .square.black-3c3c3c {
          background: #3a2817 !important;
      }
      .preview-badge {
          margin-top: 0.25rem;
          padding: 0.35rem 0.75rem;
          border-radius: 2px;
          background: rgba(200,166,98,0.16);
          border: 1px solid rgba(200,166,98,0.4);
          font-size: 0.75rem;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          font-family: var(--mono);
          display: none;
      }
      .arrow-legend {
          display: flex;
          gap: 1rem;
          justify-content: center;
          padding: 0.5rem;
          font-size: 0.8rem;
          color: var(--text-muted);
      }
      .legend-item {
          display: flex;
          align-items: center;
          gap: 0.35rem;
      }
      .legend-color {
          width: 20px;
          height: 3px;
          border-radius: 2px;
      }
      .top-lines-panel {
          display: none;
          background: rgba(0,0,0,0.25);
          border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .top-line-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0.5rem;
          border-bottom: 1px solid rgba(255,255,255,0.05);
          gap: 0.5rem;
      }
      .top-line-row:last-child {
          border-bottom: none;
      }
      .line-info {
          flex: 1;
          display: flex;
          align-items: center;
          gap: 0.75rem;
          min-width: 0;
      }
      .line-score {
          width: 60px;
          font-weight: bold;
          text-align: right;
      }
      .line-move {
          flex: 1;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          color: var(--text-muted);
      }
      .line-preview-btn {
          border: none;
          background: rgba(255,255,255,0.08);
          color: #fff;
          border-radius: 6px;
          padding: 0.3rem 0.6rem;
          cursor: pointer;
      }
      .move-list {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 2px;
          padding: 0.5rem;
      }
      .move-item {
          background: rgba(255,255,255,0.03);
          border-radius: 6px;
          padding: 0.4rem 0.5rem;
          display: flex;
          flex-direction: column;
          gap: 0.25rem;
          cursor: pointer;
      }
      .move-item:hover {
          background: rgba(255,255,255,0.08);
      }
      .move-item.active {
          border: 1px solid var(--gilt);
          background: rgba(200,166,98,0.16);
      }
      .move-core {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 0.5rem;
          font-family: var(--mono);
      }
      .move-num {
          color: var(--text-muted);
      }
      .move-meta {
          display: flex;
          justify-content: space-between;
          font-size: 0.75rem;
          color: var(--text-muted);
      }
      .move-eval {
          font-weight: bold;
      }
      /* Move-quality palette: collapse onto sage (good) → gilt (neutral) → oxblood (bad). */
      .move-best        { color: var(--sage); }
      .move-excellent   { color: var(--sage-deep); }
      .move-good        { color: var(--bone); }
      .move-inaccuracy  { color: var(--gilt-soft); }
      .move-mistake     { color: var(--oxblood-glow); }
      .move-blunder     { color: var(--oxblood); }
      .move-book        { color: var(--gilt-deep); }
      .analysis-badge.move-best,
      .analysis-badge.move-excellent,
      .analysis-badge.move-good,
      .analysis-badge.move-inaccuracy,
      .analysis-badge.move-mistake,
      .analysis-badge.move-blunder {
          color: var(--ink);
      }
      .analysis-badge.move-best       { background: rgba(138,163,115,0.25); color: var(--sage); }
      .analysis-badge.move-excellent  { background: rgba(95,119,80,0.25);   color: var(--sage-deep); }
      .analysis-badge.move-good       { background: rgba(201,191,169,0.18); color: var(--bone); }
      .analysis-badge.move-inaccuracy { background: rgba(224,195,128,0.18); color: var(--gilt-soft); }
      .analysis-badge.move-mistake    { background: rgba(168,65,65,0.22);   color: var(--oxblood-glow); }
      .analysis-badge.move-blunder    { background: rgba(138,42,42,0.3);    color: var(--oxblood); }
      .analysis-badge.move-book       { background: rgba(143,115,56,0.22);  color: var(--gilt); }
      .badge {
          display: inline-block;
          padding: 0.2rem 0.55rem;
          border-radius: 2px;
          font-size: 0.65rem;
          font-family: var(--mono);
          letter-spacing: 0.18em;
          text-transform: uppercase;
          font-weight: 500;
          margin-left: 0.35rem;
      }
      .badge.brilliant {
          background: rgba(224,195,128,0.18);
          color: var(--gilt-soft);
          border: 1px solid rgba(224,195,128,0.4);
      }
      .badge.great {
          background: rgba(138,163,115,0.2);
          color: var(--sage);
          border: 1px solid rgba(138,163,115,0.4);
      }
      .badge.only {
          background: rgba(138,42,42,0.2);
          color: var(--oxblood-glow);
          border: 1px solid rgba(138,42,42,0.4);
      }
      .phase-summary {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          padding: 0.75rem 0;
      }
      .stats-summary {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          padding: 0.75rem 0;
      }
      .nav-controls {
          display: flex;
          padding: 1rem;
          gap: 0.5rem;
          border-top: 1px solid rgba(255,255,255,0.08);
      }
      .nav-btn {
          flex: 1;
          border: none;
          border-radius: 8px;
          padding: 0.65rem;
          background: rgba(255,255,255,0.1);
          color: #fff;
          font-size: 1.3rem;
          cursor: pointer;
      }
      .performance-overview {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.75rem;
      }
      .performance-card {
          background: rgba(0,0,0,0.35);
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 10px;
          padding: 0.75rem;
      }
      .performance-side-label {
          text-transform: uppercase;
          font-size: 0.75rem;
          letter-spacing: 0.1em;
          color: var(--text-muted);
          margin-bottom: 0.35rem;
      }
      .stat-row {
          display: flex;
          justify-content: space-between;
          margin: 0.25rem 0;
          font-size: 0.9rem;
      }
      .summary-panel {
          background: rgba(0,0,0,0.35);
          border: 1px solid rgba(255,255,255,0.05);
          border-radius: 10px;
          padding: 1rem;
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
      }
      .summary-placeholder {
          text-align: center;
          opacity: 0.7;
          font-style: italic;
      }
      .summary-title {
          font-size: 1rem;
          font-weight: bold;
      }
      .summary-subtitle {
          color: var(--text-muted);
          font-size: 0.85rem;
      }
      .phase-grid {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 0.5rem;
      }
      .phase-card {
          background: rgba(255,255,255,0.05);
          border-radius: 8px;
          padding: 0.5rem;
          text-align: center;
      }
      .phase-label {
          text-transform: uppercase;
          font-size: 0.7rem;
          color: var(--text-muted);
      }
      .phase-value {
          font-weight: bold;
      }
      .key-moments {
          display: flex;
          flex-direction: column;
          gap: 0.4rem;
      }
      .moment-row {
          background: rgba(255,255,255,0.04);
          border-radius: 6px;
          padding: 0.4rem 0.6rem;
          font-size: 0.85rem;
      }
      .moment-title {
          font-weight: 600;
          margin-right: 0.4rem;
      }
      .summary-narrative {
          font-style: italic;
          color: var(--text-muted);
      }
      .loading-overlay {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.75);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1rem;
          z-index: 3000;
      }
      .spinner {
          width: 46px;
          height: 46px;
          border-radius: 50%;
          border: 4px solid rgba(255,255,255,0.2);
          border-top-color: var(--gilt);
          animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
          to { transform: rotate(360deg); }
      }
      .game-selector-modal {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.8);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2500;
      }
      .selector-content {
          width: min(520px, 90vw);
          max-height: 80vh;
          overflow: hidden;
          background: var(--ink-raise);
          border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.1);
          padding: 1rem;
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
      }
      .game-list {
          overflow-y: auto;
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
      }
      .game-option {
          background: rgba(255,255,255,0.05);
          border-radius: 8px;
          padding: 0.6rem;
          cursor: pointer;
      }
      .game-option:hover {
          background: rgba(255,255,255,0.15);
      }
      .moment-blunder {
          border-left: 3px solid var(--oxblood);
      }
      .moment-mistake {
          border-left: 3px solid var(--oxblood-glow);
      }
      .moment-swing {
          border-left: 3px solid var(--gilt);
      }
      .moment-info {
          border-left: 3px solid var(--whisper);
      }
      @media (max-width: 1200px) {
          .game-review-container {
              grid-template-columns: 1fr 1fr;
              grid-template-areas:
                  "board board"
                  "controls moves";
              height: auto;
          }
          .board-section { grid-area: board; }
          .controls-panel { grid-area: controls; }
          .move-list-panel { grid-area: moves; }
      }
      @media (max-width: 768px) {
          .game-review-container {
              display: flex;
              flex-direction: column;
              height: auto;
          }
          .board-wrapper { width: 100%; }
          main { padding: 0.5rem; }
      }
  </style>
</head>
<body class="review-page">
<header>
  <div class="header-content">
    <div style="display:flex;align-items:center;gap:16px;">
      <img src="icons/pawnpushicon.png" alt="PawnPush Logo" style="width:48px;height:48px;">
      <div>
        <h1>PawnPush</h1>
        <p class="tagline">A post&ndash;mortem, in the old style</p>
      </div>
    </div>
    <a href="index.html" class="back-btn">&larr;&nbsp;&nbsp;Index</a>
  </div>
</header>
<main>
  <div class="game-review-container">
    <div class="panel controls-panel">
      <div class="panel-header">
        <div class="section-icon">&sect;</div>
        <h3>Analysis</h3>
      </div>
      <div class="panel-content">
        <div id="analysisDisplay" class="analysis-display">
          <div class="analysis-empty">Load a game to begin.</div>
        </div>
        <div id="gameSummaryPanel" class="summary-panel">
          <div class="summary-placeholder">Insights will appear here after analysis.</div>
        </div>
        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08);">
          <div class="input-group">
            <label>PGN / Move List</label>
            <textarea id="pgnInput" rows="3" placeholder="1. e4 e5 2. Nf3 Nc6 ..."></textarea>
          </div>
          <div class="input-group">
            <label>FEN</label>
            <input type="text" id="fenInput" placeholder="rnbqkbnr/pppppppp/8/...">
          </div>
          <div class="button-grid">
            <button class="btn btn-primary" id="loadGameBtn">Load</button>
            <button class="btn btn-secondary" id="clearBtn">Clear</button>
            <button class="btn chesscom-btn" id="chesscomBtn">Import from Chess.com</button>
          </div>
          <button class="btn btn-primary" id="analyzeBtn" style="width:100%;">
            <span class="btn-text">Analyse the game</span>
          </button>
          <button class="btn btn-secondary" id="analyzePositionBtn" style="width:100%; margin-top:0.5rem;">
            Analyse position
          </button>
        </div>
      </div>
    </div>
    <div class="board-section">
      <div class="eval-bar-container">
        <div id="evalScoreBoard" class="eval-text">+0.00</div>
        <div id="evalBarFill" class="eval-fill"></div>
      </div>
      <div id="board-wrapper" class="board-wrapper">
        <div id="board"></div>
        <svg id="board-arrows" xmlns="http://www.w3.org/2000/svg" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
              <polygon points="0 0, 6 3, 0 6" fill="rgba(0,0,0,0.6)" />
            </marker>
          </defs>
        </svg>
      </div>
      <div class="arrow-legend">
        <div class="legend-item">
          <div class="legend-color" style="background:var(--sage);"></div>
          <span>Best</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:var(--gilt);"></div>
          <span>2nd</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:var(--oxblood-glow);"></div>
          <span>3rd</span>
        </div>
      </div>
      <div id="previewBadge" class="preview-badge"></div>
    </div>
    <div class="panel move-list-panel">
      <div class="panel-header">
        <div class="section-icon">&para;</div>
        <h3>Notation</h3>
      </div>
      <div id="topLinesPanel" class="top-lines-panel"></div>
      <div class="panel-content" style="padding:0;">
        <div class="performance-overview">
          <div class="performance-card">
            <div class="performance-side-label">White</div>
            <div class="stat-row"><span>Accuracy</span><span id="whiteAccuracy">--</span></div>
            <div class="stat-row"><span>ACPL</span><span id="whiteAcpl">--</span></div>
            <div class="stat-row"><span>Est. Rating</span><span id="whiteRating">--</span></div>
          </div>
          <div class="performance-card">
            <div class="performance-side-label">Black</div>
            <div class="stat-row"><span>Accuracy</span><span id="blackAccuracy">--</span></div>
            <div class="stat-row"><span>ACPL</span><span id="blackAcpl">--</span></div>
            <div class="stat-row"><span>Est. Rating</span><span id="blackRating">--</span></div>
          </div>
        </div>
        <div id="openingNameDisplay" style="padding: 1rem; border-top: 1px solid rgba(236,228,211,0.08); display: none;">
          <div style="text-align: center; padding: 1.25rem 1rem; background: rgba(11,10,9,0.5); border: 1px solid rgba(200,166,98,0.22); border-top: 2px solid var(--gilt); border-radius: 2px;">
            <div style="font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;">Opening</div>
            <div id="openingEco" style="font-family: var(--mono); font-size: 0.95rem; font-weight: 500; color: var(--gilt); margin-bottom: 0.35rem; letter-spacing: 0.08em;"></div>
            <div id="openingName" style="font-size: 1.1rem; color: var(--parchment); font-family: var(--serif); font-style: italic; font-weight: 700;"></div>
          </div>
        </div>
        <div id="moveList" class="move-list"></div>
        <div style="padding: 1rem; border-top: 1px solid rgba(255,255,255,0.08);">
          <div style="margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Accuracy Over Time</div>
          <canvas id="accuracyChart" style="width: 100%; height: 150px; background: rgba(0,0,0,0.2); border-radius: 6px;"></canvas>
          <div style="margin-top: 1rem; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">CPL Per Move</div>
          <canvas id="acplChart" style="width: 100%; height: 150px; background: rgba(0,0,0,0.2); border-radius: 6px;"></canvas>
        </div>
      </div>
      <div class="nav-controls">
        <button class="nav-btn" id="firstBtn">⏮</button>
        <button class="nav-btn" id="prevBtn">◀</button>
        <button class="nav-btn" id="nextBtn">▶</button>
        <button class="nav-btn" id="lastBtn">⏭</button>
      </div>
    </div>
  </div>
</main>
<script src="game-review.js"></script>
</body>
</html>
